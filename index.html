<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayudham</title>
  <meta name="description" content="Ayudham — Neural rendering infrastructure, coming soon." />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 640px;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    p.tagline {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #a0a0a0;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    a.email {
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #555;
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }

    a.email:hover {
      border-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ayudham</h1>
    <p class="tagline">Neural rendering infrastructure, coming soon.</p>
    <a class="email" href="mailto:adarsh@ayudham.tech">adarsh@ayudham.tech</a>
  </div>
</body>
</html>
